<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="B7MapAlignerNone" description="B7 oracle for TOPPMapAlignerBase">
    <ITEM name="version" value="4.0.0" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;B7MapAlignerNone&apos;">
      <ITEMLIST name="in" type="input-file" description="Input files to align (all must have the same file type)" required="true" advanced="false" supported_formats="*.featureXML,*.consensusXML">
      </ITEMLIST>
      <ITEMLIST name="out" type="output-file" description="Output files (same file type as &apos;in&apos;). This option or &apos;trafo_out&apos; has to be provided; they can be used together." required="false" advanced="false" supported_formats="*.featureXML,*.consensusXML">
      </ITEMLIST>
      <ITEMLIST name="trafo_out" type="output-file" description="Transformation output files. This option or &apos;out&apos; has to be provided; they can be used together." required="false" advanced="false" supported_formats="*.trafoXML">
      </ITEMLIST>
      <ITEMLIST name="in_spectra_files" type="input-file" description="Optional input spectra files (mzML) that will be transformed along with the alignment. Size must match the number of input files." required="false" advanced="false" supported_formats="*.mzML">
      </ITEMLIST>
      <ITEMLIST name="out_spectra_files" type="output-file" description="Optional output spectra files (mzML) corresponding to transformed in_spectra_files. Size must match in_spectra_files." required="false" advanced="false" supported_formats="*.mzML">
      </ITEMLIST>
      <ITEM name="store_original_rt" value="false" type="bool" description="keep the original retention times" required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
