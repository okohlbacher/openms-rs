<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <ITEM name="gaussian_width" value="-1.0" type="double" description="" required="false" advanced="false" />
  <ITEM name="ppm_tolerance" value="10.0" type="double" description="Gaussian width, depending on the m/z position.#br#The higher the value, the wider the peak and therefore the wider the gaussian." required="false" advanced="false" restrictions="0.0:" />
  <ITEM name="use_ppm_tolerance" value="false" type="bool" description="If true, instead of the gaussian_width value, the ppm_tolerance is used. The gaussian is calculated in each step anew, so this is much slower." required="false" advanced="false" />
  <ITEM name="write_log_messages" value="false" type="bool" description="true: Warn if no signal was found by the Gauss filter algorithm." required="false" advanced="false" />
</PARAMETERS>
