<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="FeatureFinderLFQ" description="Feature detection for LC-MS1 data (EXPERIMENTAL)">
    <ITEM name="version" value="1.0.0" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;FeatureFinderLFQ&apos;">
      <ITEM name="in" value="" type="input-file" description="Input mzML file (centroided data)" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out" value="" type="output-file" description="Output featureXML file" required="true" advanced="false" supported_formats="*.featureXML" />
      <ITEM name="out_tsv" value="" type="output-file" description="Optional: output TSV file (Biosaur2 format)" required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="out_hills" value="" type="output-file" description="Optional: write detected hills to TSV" required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="write_hills" value="false" type="bool" description="Force writing of hills file even if no output path was provided" required="false" advanced="false" />
      <ITEM name="mini" value="1.0" type="double" description="Minimum intensity threshold" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="minmz" value="350.0" type="double" description="Minimum m/z value" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="maxmz" value="1500.0" type="double" description="Maximum m/z value" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="htol" value="8.0" type="double" description="Mass accuracy in ppm for combining peaks into hills" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="itol" value="8.0" type="double" description="Mass accuracy in ppm for isotopic patterns" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="hvf" value="1.3" type="double" description="Hill valley factor for splitting hills" required="false" advanced="false" restrictions="1.0:" />
      <ITEM name="ivf" value="5.0" type="double" description="Isotope valley factor for splitting isotope patterns" required="false" advanced="false" restrictions="1.0:" />
      <ITEM name="minlh" value="2" type="int" description="Minimum number of scans for a hill" required="false" advanced="false" restrictions="1:" />
      <ITEM name="pasefmini" value="100.0" type="double" description="Minimum combined intensity for PASEF/TIMS clusters after m/z–ion-mobility centroiding." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="pasefminlh" value="1" type="int" description="Minimum number of raw points per PASEF/TIMS cluster during centroiding." required="false" advanced="false" restrictions="1:" />
      <ITEM name="cmin" value="1" type="int" description="Minimum charge state" required="false" advanced="false" restrictions="1:" />
      <ITEM name="cmax" value="6" type="int" description="Maximum charge state" required="false" advanced="false" restrictions="1:" />
      <ITEM name="iuse" value="0" type="int" description="Number of isotopes for intensity calculation (0=mono only, -1=all, 1=mono+first, etc.)" required="false" advanced="false" restrictions="-1:" />
      <ITEM name="nm" value="false" type="bool" description="Negative mode (affects neutral mass calculation)" required="false" advanced="false" />
      <ITEM name="tof" value="false" type="bool" description="Enable TOF-specific intensity filtering" required="false" advanced="false" />
      <ITEM name="profile" value="false" type="bool" description="Enable profile mode processing (centroid spectra using PeakPickerHiRes)" required="false" advanced="false" />
      <ITEM name="paseftol" value="0.05" type="double" description="Ion mobility accuracy for linking peaks into hills and grouping isotopes (0 = disable IM-based gating). Default is for 1/K0 units (e.g., 0.03-0.08). For CCS data, use larger values (e.g., 5-20 square angstroms)." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="use_hill_calib" value="false" type="bool" description="Enable automatic hill mass tolerance calibration" required="false" advanced="false" />
      <ITEM name="ignore_iso_calib" value="false" type="bool" description="Disable automatic isotope mass error calibration" required="false" advanced="false" />
      <ITEM name="hrttol" value="10.0" type="double" description="Maximum allowed RT difference (in seconds) between monoisotopic hill apex and isotope hill apex when assembling isotope patterns (0 disables RT gating)." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="convex_hulls" value="bounding_box" type="string" description="Representation of feature convex hulls in the output FeatureMap. &apos;bounding_box&apos; stores a single RT–m/z bounding box per feature (smaller featureXML, no per-trace detail), whereas &apos;mass_traces&apos; stores one convex hull per contributing hill using all mass-trace points (larger featureXML, preserves detailed trace shape)." required="false" advanced="false" restrictions="mass_traces,bounding_box" />
      <ITEM name="faims_merge_features" value="true" type="string" description="For FAIMS data with multiple compensation voltages: Merge features representing the same analyte detected at different CV values into a single feature. Only features with DIFFERENT FAIMS CV values are merged (same CV = different analytes). Has no effect on non-FAIMS data." required="false" advanced="false" restrictions="true,false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
