<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <ITEM name="distance_metric" value="LINF" type="string" description="Distance metric for comparing feature positions" required="false" advanced="true" restrictions="L1,L2,LINF" />
  <ITEM name="max_rt_shift" value="100.0" type="double" description="Maximum allowed RT difference (in seconds) for matching features." required="false" advanced="false" restrictions="0.0:" />
  <ITEM name="mz_unit" value="ppm" type="string" description="Unit for the m/z tolerance. &apos;Da&apos; uses max_mz_shift_da; &apos;ppm&apos; uses max_mz_shift_ppm and log-transforms the m/z axis." required="false" advanced="false" restrictions="Da,ppm" />
  <ITEM name="max_mz_shift_da" value="0.3" type="double" description="Maximum allowed m/z difference in Daltons. Used when mz_unit is &apos;Da&apos;." required="false" advanced="false" restrictions="0.0:" />
  <ITEM name="max_mz_shift_ppm" value="10.0" type="double" description="Maximum allowed m/z difference in ppm. Used when mz_unit is &apos;ppm&apos;." required="false" advanced="false" restrictions="0.0:" />
  <ITEM name="trash_cost" value="0.0" type="double" description="Cost of leaving a feature unmatched (in seconds). Set to 0 to auto-derive from max_rt_shift (a match at the boundary costs the same as no match). Increase to prefer matching over leaving features unmatched." required="false" advanced="true" restrictions="0.0:" />
  <ITEM name="normalize_intensities" value="true" type="string" description="Normalize feature intensities per map before alignment so that total intensity is equal across maps." required="false" advanced="false" restrictions="true,false" />
  <ITEM name="decharge_mz" value="false" type="bool" description="Convert observed m/z values to their singly-charged (z=1) equivalent before alignment. Features with charge z&gt;1 are projected to [M+H]+ m/z, making features of the same compound but different charge states directly comparable. If a feature carries a &apos;dc_charge_adduct_mass&apos; MetaValue (set by MetaboliteFeatureDeconvolution), the stored adduct mass is used; otherwise pure H+ adducts are assumed. Features with unknown charge (z=0) are left unchanged." required="false" advanced="false" />
</PARAMETERS>
