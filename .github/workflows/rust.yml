name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install independent XML schema validator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features idxml
      - run: cargo test --locked --no-default-features --features paramxml --test paramxml --test system_file
      - run: cargo test --locked --no-default-features --features featurexml --test featurexml --test file_handler
      - run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test file_handler
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 tools/generate_modifications.py --check
      - run: python3 tools/generate_enzymes.py --check
      - run: python3 tools/generate_ribonucleotides.py --check
      - run: python3 tools/generate_rnases.py --check
      - run: python3 tools/generate_monosaccharides.py --check
      - run: python3 tools/check_core_sdk.py
      - run: python3 tools/test_core_sdk.py
      - run: python3 tools/core_sdk_coverage.py
      - run: python3 tools/test_core_sdk_coverage.py
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features --features featurexml --test featurexml --test file_handler
      - run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test file_handler
      - run: cargo test --locked --no-default-features --features numpress --test numpress_coder --test numpress
      - run: cargo test --locked --no-default-features --test chromatogram_tools --test processing_acquisition
      - run: cargo test --locked --no-default-features --test mass_trace --test constants --test monosaccharide_db
      - run: cargo test --locked --no-default-features --test mass_trace_detection --test elution_peak_detection --test proforma --test proforma_writer_probe --test protein_run --test run_mapping
      - run: cargo test --locked --no-default-features --test unique_id --test peak2d --test experiment_2d --test ims_mass_decomposers --test sequence_coverage
      - run: cargo test --locked --no-default-features --test ims_isotopes --test ims_element --test ims_alphabet --test area_iteration --test peak_data --test peak_index --test numpress
      - run: cargo test --locked --no-default-features --test log_stream --test progress_logger --test modification_definition_io
      - run: cargo test --locked --no-default-features --features paramxml --test paramxml --test system_file
      - run: cargo test --locked --no-default-features --test fasta --test formats --test experiment_aggregation --test experiment_summary --test kernel_value_traits --test peak_file_options --test metadata_hash --test mass_decomposition --test mass_decomposition_algorithm --test ims_weights --test mobilogram --test data_array_descriptions
      - run: cargo test --locked --no-default-features --features mzml --test mzml_numpress --test numpress_coder --test mzml_acquisition_guards --test mzml_settings --test mzml_acquisition
      - run: cargo test --locked --no-default-features --features mzml --test indexed_mzml --test mzml_product --test mzml_load_options --test mzml_paths --test data_array_xml
      - run: cargo test --locked --no-default-features --features idxml --test identification_paths --test data_array_xml
