name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features --features sqlite --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features sqmass --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features idxml
      - run: cargo test --locked --no-default-features --features paramxml --test paramxml --test system_file
      - run: cargo test --locked --no-default-features --features "mzml paramxml" --test topp_dta_extractor --test topp_mzml_splitter --test topp_map_normalizer --test topp_spectra_filter_window_mower --test topp_baseline_filter --test topp_cli_lifecycle
      - run: cargo test --locked --no-default-features --features featurexml --test featurexml --test file_handler
      - run: cargo test --locked --no-default-features --features cv-mapping --test cv_mapping_file --test cv_mapping_values
      - run: cargo test --locked --no-default-features --features semantic-validation --test semantic_validator --test cv_mapping_file --test cv_mapping_values
      - run: cargo test --locked --no-default-features --features mzml-validation --test mzml_validator --test semantic_validator --test cv_mapping_file
      - run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
      - run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test file_handler
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo fmt --all -- --check
      - run: python3 tools/generate_modifications.py --check
      - run: python3 tools/generate_enzymes.py --check
      - run: python3 tools/generate_ribonucleotides.py --check
      - run: python3 tools/generate_rnases.py --check
      - run: python3 tools/generate_monosaccharides.py --check
      - run: python3 tools/generate_controlled_vocabulary_reference.py --check
      - run: python3 tools/generate_cv_mapping_reference.py --check
      - run: python3 tools/semantic_validator/projection.py --check
      - run: python3 tools/generate_metabo_isotope_models.py --check
      - run: python3 tools/probes/ims_witness_source_oracle.py --check
      - run: python3 tools/check_doc_coverage.py
      - run: python3 tools/check_module_cycles.py
      - run: python3 tools/check_core_sdk.py
      - run: python3 tools/test_core_sdk.py
      - run: python3 tools/core_sdk_coverage.py
      - run: python3 tools/test_core_sdk_coverage.py
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features --features sqlite --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features sqmass --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features featurexml --test featurexml --test file_handler
      - run: cargo test --locked --no-default-features --features cv-mapping --test cv_mapping_file --test cv_mapping_values
      - run: cargo test --locked --no-default-features --features semantic-validation --test semantic_validator --test cv_mapping_file --test cv_mapping_values
      - run: cargo test --locked --no-default-features --features mzml-validation --test mzml_validator --test semantic_validator --test cv_mapping_file
      - run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
      - run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test file_handler
      - run: cargo test --locked --no-default-features --features numpress --test numpress_coder --test numpress
      - run: cargo test --locked --no-default-features --test chromatogram_tools --test processing_acquisition --test chromatogram_merge
      - run: cargo test --locked --no-default-features --test mass_trace --test constants --test monosaccharide_db
      - run: cargo test --locked --no-default-features --test mass_trace_detection --test elution_peak_detection --test proforma --test proforma_writer_probe --test proforma_parser --test proforma_parser_probe --test proforma_resolution --test proforma_mass --test proforma_conversion --test proforma_spectra --test theoretical_xlms --test protein_cross_link --test cv_mapping_values --test controlled_vocabulary --test protein_run --test run_mapping --test experiment_metadata --test feature_hypothesis --test document_identifier --test datetime --test experimental_settings --test experiment_values --test feature_finding_metabo
      - run: cargo test --locked --no-default-features --test spectrum_type --test interfaces --test unique_id --test peak2d --test experiment_2d --test ims_mass_decomposers --test sequence_coverage
      - run: cargo test --locked --no-default-features --test parallel_determinism --test ranges --test range_utils --test spectrum_helper --test kernel_aliases --test rich_peak2d --test feature_handle --test binned_spectrum --test spectrum_mobility --test feature_identification --test mrm --test map_operations --test conversion_helper
      - run: cargo test --locked --no-default-features --test dposition --test dinterval --test drange
      - run: cargo test --locked --no-default-features --test ims_isotopes --test ims_element --test ims_alphabet --test area_iteration --test peak_data --test peak_index --test numpress
      - run: cargo test --locked --no-default-features --test log_stream --test progress_logger --test modification_definition_io
      - run: cargo test --locked --no-default-features --features paramxml --test paramxml --test system_file
      - run: cargo test --locked --no-default-features --test experimental_design --test fasta --test formats --test experiment_aggregation --test experiment_summary --test kernel_value_traits --test peak_file_options --test identification --test metadata_hash --test mass_decomposition --test mass_decomposition_algorithm --test ims_weights --test mobilogram --test data_array_descriptions
      - run: cargo test --locked --no-default-features --features mzml --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features mzml --test indexed_mzml_handler --test mzml_typed_transport --test record_metadata --test mzml_normalization --test mzml_write_options --test mzml_isolation --test mzml_centroid --test mzml_consumer --test mzml_header --test mzml_numpress --test numpress_coder --test mzml_acquisition_guards --test mzml_settings --test mzml_acquisition --test mzml_counts
      - run: cargo test --locked --no-default-features --features mzml --test indexed_mzml --test mzml_product --test mzml_load_options --test mzml_paths --test data_array_xml --test mzml_list_counts --test imzml_handler --test imzml_writer --test imzml_file --test imzml_all_modes --test on_disc_imzml_experiment
      - run: cargo test --locked --no-default-features --features proforma-json --test proforma_json
      - run: cargo test --locked --no-default-features --features idxml --test identification_paths --test data_array_xml
      - run: cargo test --locked --no-default-features --test mztab --test mztab_file --test mztab_m --test percolator_infile --test mascot_generic --test sv_out_stream
      - run: cargo test --locked --no-default-features --features idxml --test pepxml --test mascot_xml --test mzidentml
      - run: cargo test --locked --no-default-features --features mzml --test ms_data_writing_consumer --test mzxml --test mzdata
      - run: cargo test --locked --no-default-features --features consensusxml --test msstats --test transformation_xml
      - run: cargo test --locked --no-default-features --features featurexml --test transformation_xml
      - run: cargo test --locked --no-default-features --features paramxml --test qcml
      - run: cargo test --locked --no-default-features --test feature_finder_picked_helper_structs --test isotopes_source_precision --test geometry_bounding_box --test fuzzy_string_comparator
      - run: cargo test --locked --no-default-features --features mzml --test peak_type_estimator --test faims_helper --test mzml_mobility
      - run: cargo test --locked --no-default-features --features mzml,featurexml --test file_handler_type_detection
      - run: cargo test --locked --no-default-features --features mzml,paramxml --test topp_cli_lifecycle
  cross-platform:
    # Linux-first development: these run on a release tag or on demand, not on
    # every push. Keep them green before cutting a release.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features --features sqlite --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features sqmass --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features
  schema-minimum-platforms:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
  portable-feature-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: python3 tools/check_schema_feature_graph.py
