name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # >>> generated by tools/ci_matrix.py from its JOBS - edit there, then run it with --write
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [all-features, slices]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.leg }}
      - uses: ./.github/actions/setup-libxml
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --all-targets
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --doc
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqlite --test mzml_sqlite_swath_handler --test openswath_export --test openswath_export_oracle --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test mzml_sqlite_swath_handler --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqlite file-compression" --test oms_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqmass --test mzml_precursor_activation --test mzml_sqlite_handler --test sqmass_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_precursor_activation --test mzml_sqlite_handler --test sqmass_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features idxml
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features paramxml --test param_ctd --test parameter_information --test paramxml --test system_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "mzml paramxml" --test topp_baseline_filter --test topp_baseline_filter_edges --test topp_cli_completion --test topp_cli_console --test topp_cli_lifecycle --test topp_dta_extractor --test topp_map_normalizer --test topp_mzml_splitter --test topp_peak_picker_hi_res --test topp_spectra_filter_window_mower --test topp_threads
