name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # >>> generated by tools/ci_matrix.py from its JOBS - edit there, then run it with --write
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [all-features, slices]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.leg }}
      - uses: ./.github/actions/setup-libxml
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --all-targets
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --doc
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqlite --test mzml_sqlite_swath_handler --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test mzml_sqlite_swath_handler --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqmass --test mzml_precursor_activation --test mzml_sqlite_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_precursor_activation --test mzml_sqlite_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features idxml
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features paramxml --test paramxml --test system_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "mzml paramxml" --test topp_baseline_filter --test topp_baseline_filter_edges --test topp_cli_lifecycle --test topp_dta_extractor --test topp_map_normalizer --test topp_mzml_splitter --test topp_peak_picker_hi_res --test topp_spectra_filter_window_mower --test topp_threads
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "mzml paramxml featurexml" --test file_info_checks --test topp_feature_finder_centroided --test topp_file_info
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "mzml paramxml parallel" --test peak_picking_experiment --test topp_peak_picker_hi_res --test topp_threads
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml --test mzml_source_file_round_trip
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features featurexml --test featurexml --test file_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features cv-mapping --test cv_mapping_file --test cv_mapping_values
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features semantic-validation --test cv_mapping_file --test cv_mapping_values --test semantic_validator
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml-validation --test cv_mapping_file --test mzml_validator --test semantic_validator
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test file_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "consensusxml idxml" --test file_info_a7
  minimum-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [all-features, mzml-paramxml, slices]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.leg }}
      - uses: ./.github/actions/setup-libxml
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --all-targets
      - if: matrix.leg == 'all-features'
        run: cargo test --locked --all-features --doc
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqlite --test mzml_sqlite_swath_handler --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test mzml_sqlite_swath_handler --test sqlite_connector
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features sqmass --test mzml_precursor_activation --test mzml_sqlite_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_precursor_activation --test mzml_sqlite_handler
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features featurexml --test data_array_xml --test featurexml --test file_handler --test transformation_xml
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features cv-mapping --test cv_mapping_file --test cv_mapping_values
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features semantic-validation --test cv_mapping_file --test cv_mapping_values --test semantic_validator
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml-validation --test cv_mapping_file --test mzml_validator --test semantic_validator
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features consensusxml --test consensusxml --test data_array_xml --test file_handler --test msstats --test transformation_xml
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features numpress --test numpress --test numpress_coder
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features paramxml --test paramxml --test qcml --test system_file
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features mzml --test data_array_xml --test faims_helper --test file_info_checks --test im_data_converter --test imzml_all_modes --test imzml_file --test imzml_handler --test imzml_writer --test indexed_mzml --test indexed_mzml_handler --test ms_data_writing_consumer --test mzdata --test mzml --test mzml_acquisition --test mzml_acquisition_guards --test mzml_auxiliary_review --test mzml_auxiliary_writer_review --test mzml_centroid --test mzml_consumer --test mzml_counts --test mzml_header --test mzml_header_leniency --test mzml_isolation --test mzml_list_counts --test mzml_load_options --test mzml_mobility --test mzml_normalization --test mzml_numpress --test mzml_param_groups --test mzml_paths --test mzml_precursor_activation --test mzml_product --test mzml_reader_scale --test mzml_review --test mzml_settings --test mzml_source_file_round_trip --test mzml_typed_transport --test mzml_write_options --test mzml_writer_scale --test mzxml --test numpress_coder --test on_disc_experiment --test on_disc_imzml_experiment --test peak_type_estimator --test record_metadata
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features proforma-json --test proforma_json
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features idxml --test data_array_xml --test identification_paths --test identification_pipeline --test idxml --test idxml_definitions --test mascot_xml --test mzidentml --test pepxml --test protein_workflow
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "mzml featurexml" --test file_handler_type_detection --test file_info
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features "consensusxml idxml" --test file_info_a7
      - if: matrix.leg == 'mzml-paramxml'
        run: cargo test --locked --no-default-features --features "mzml paramxml" --test feature_finder_picked_seeds --test peak_picking_experiment --test signal_to_noise --test topp_baseline_filter --test topp_baseline_filter_edges --test topp_cli_lifecycle --test topp_dta_extractor --test topp_map_normalizer --test topp_mzml_splitter --test topp_peak_picker_hi_res --test topp_spectra_filter_window_mower --test topp_threads
      - if: matrix.leg == 'mzml-paramxml'
        run: cargo test --locked --no-default-features --features "mzml paramxml featurexml" --test feature_finder_picked --test feature_finder_picked_instrumentation --test feature_finder_picked_seeds --test file_info_checks --test topp_feature_finder_centroided --test topp_file_info
      - if: matrix.leg == 'mzml-paramxml'
        run: cargo test --locked --no-default-features --features "mzml paramxml parallel" --test peak_picking_experiment --test topp_peak_picker_hi_res --test topp_threads
      - if: matrix.leg == 'slices'
        run: cargo test --locked --no-default-features --features network --test network --test network_get_request --test update_check
  # <<< end of generated jobs
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo fmt --all -- --check
      - run: python3 tools/generate_modifications.py --check
      - run: python3 tools/generate_enzymes.py --check
      - run: python3 tools/generate_ribonucleotides.py --check
      - run: python3 tools/generate_rnases.py --check
      - run: python3 tools/generate_monosaccharides.py --check
      - run: python3 tools/generate_controlled_vocabulary_reference.py --check
      - run: python3 tools/generate_cv_mapping_reference.py --check
      - run: python3 tools/semantic_validator/projection.py --check
      - run: python3 tools/generate_metabo_isotope_models.py --check
      - run: python3 tools/probes/ims_witness_source_oracle.py --check
      - run: python3 tools/check_doc_coverage.py
      - run: python3 tools/check_module_cycles.py
      - run: python3 tools/test_module_cycles.py
      - run: python3 tools/check_core_sdk.py
      - run: python3 tools/test_core_sdk.py
      - run: python3 tools/core_sdk_coverage.py
      - run: python3 tools/test_core_sdk_coverage.py
      - run: python3 tools/test_source_citations.py
      # The coverage gate reads this file with PyYAML, as the pre-push sweep
      # does; the image does not promise it to the system Python.
      - run: sudo apt-get install -y python3-yaml
      - run: python3 tools/ci_matrix.py --check
      - run: python3 tools/test_ci_matrix.py
      - run: python3 tools/ci_coverage.py --check
      - run: python3 tools/test_ci_coverage.py
      # The opt-out docs/FMA_BUILD_FLAG.md documents and src/system/cpu_features.rs
      # prints. RUSTFLAGS replaces .cargo/config.toml's rustflags rather than
      # adding to them, so this is the baseline build a user on an older
      # processor gets, and it must keep compiling.
      - run: RUSTFLAGS="-C target-feature=-fma" cargo check --locked --all-features --all-targets
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  cross-platform:
    # Linux-first development: these run on a release tag or on demand, not on
    # every push. Keep them green before cutting a release.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo test --locked --no-default-features --features sqlite --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features "sqlite rusqlite/extra_check" --test sqlite_connector --test mzml_sqlite_swath_handler
      - run: cargo test --locked --no-default-features --features sqmass --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features --features "sqmass rusqlite/extra_check" --test mzml_sqlite_handler --test mzml_precursor_activation
      - run: cargo test --locked --no-default-features
  schema-minimum-platforms:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-libxml
      - run: cargo test --locked --no-default-features --features mzml-schema --test mzml_schema --test mzml_schema_offline
  portable-feature-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: python3 tools/check_schema_feature_graph.py
