[package]
name = "openms"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust port of the OpenMS scientific core"
license-file = "LICENSES.md"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "BaselineFilter"
path = "src/bin/BaselineFilter.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "DTAExtractor"
path = "src/bin/DTAExtractor.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "MapNormalizer"
path = "src/bin/MapNormalizer.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "SpectraFilterWindowMower"
path = "src/bin/SpectraFilterWindowMower.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "MzMLSplitter"
path = "src/bin/MzMLSplitter.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "PeakPickerHiRes"
path = "src/bin/PeakPickerHiRes.rs"
required-features = ["mzml", "paramxml"]

[[bin]]
name = "FileInfo"
path = "src/bin/FileInfo.rs"
required-features = ["mzml", "paramxml", "featurexml"]

[[bin]]
name = "FeatureFinderCentroided"
path = "src/bin/FeatureFinderCentroided.rs"
required-features = ["mzml", "paramxml", "featurexml"]

[[bin]]
name = "FeatureFinderLFQ"
path = "src/bin/FeatureFinderLFQ.rs"
required-features = ["mzml", "paramxml", "featurexml"]

[[bin]]
name = "FuzzyDiff"
path = "src/bin/FuzzyDiff.rs"
required-features = ["paramxml"]

[features]
default = ["mzml", "idxml", "rna-json", "paramxml", "featurexml", "consensusxml", "traml", "cv-mapping", "parallel"]
mzml = ["dep:quick-xml", "dep:sha1", "file-compression", "numpress"]
numpress = ["dep:base64", "dep:flate2"]
idxml = ["dep:quick-xml"]
rna-json = ["dep:serde_json"]
proforma-json = ["dep:serde_json"]
paramxml = ["dep:quick-xml", "dep:serde_json", "file-compression"]
featurexml = ["dep:quick-xml", "file-compression"]
consensusxml = ["dep:quick-xml", "file-compression"]
# TraML transition lists (TraMLFile, TraMLHandler).
traml = ["dep:quick-xml", "file-compression"]
semantic-validation = ["cv-mapping"]
mzml-validation = ["mzml", "semantic-validation"]
mzml-schema = ["mzml", "xml-schema"]
# XSD validation against every schema the source bundles, and against a
# caller's self-contained schema (XMLValidator). libxml2 through the exact
# binding, so it stays out of `default` like `mzml-schema` always has.
xml-schema = ["dep:libxml", "dep:quick-xml", "file-compression"]
cv-mapping = ["dep:quick-xml", "file-compression"]
file-compression = ["dep:flate2", "dep:bzip2", "dep:zip"]
sqlite = ["dep:rusqlite"]
sqmass = ["sqlite", "mzml"]
# Bruker timsTOF .d (TDF) reading: SQLite metadata plus zstd frames decoded by
# the pure-Rust ruzstd (docs/THIRD_PARTY_CRATE_DECISIONS.md).
bruker-tdf = ["sqlite", "dep:ruzstd"]
parallel = ["dep:rayon"]
network = ["dep:ureq"]
# Apache Arrow tables and Parquet files: the FORMAT Arrow/Parquet family
# (ArrowSchemaRegistry, ArrowIOHelpers, ParquetFile, the *ArrowIO classes) and
# everything built on it. Kept out of `default` because ZSTD, the source's
# default Parquet codec, compiles the C zstd library (see
# docs/THIRD_PARTY_CRATE_DECISIONS.md). `numpress` because the OpenSWATH
# Parquet files (.xic/.xim/.xipm) store MS-Numpress + zlib arrays.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer", "dep:arrow-select", "dep:parquet", "numpress", "dep:blake2"]
# Knowledge-base XML readers: PTMXML, Unimod XML (a runtime reader for the
# modification data the default build flattens offline) and UniProtKB XML
# (plain or gzip/bzip2). quick-xml is already a dependency of the default
# formats; this only gathers the three dialects behind one switch.
kb-xml = ["dep:quick-xml", "file-compression"]

[dependencies]
libxml = { version = "=0.3.14", optional = true }
sha1 = { version = "=0.10.7", default-features = false, features = ["force-soft"], optional = true }
libm = "=0.2.16"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
quick-xml = { version = "=0.39.4", optional = true }
base64 = { version = "=0.22.1", optional = true }
flate2 = { version = "=1.1.9", optional = true }
bzip2 = { version = "=0.6.1", optional = true }
# ZIP containers: XMLFile::parse_ reads a one-entry ZIP archive through libzip
# (format::zip_input), FORMAT/ZipIfstream reads a single-entry archive like a
# gzip or bzip2 file and FORMAT/ZipArchiveFile writes archives, replacing
# libzip. Only the archive structure (central directory, ZIP64, local headers)
# is used from this crate; entries are decoded with flate2 and bzip2 above and
# written stored. 6.0.0 (MSRV 1.83) and not 7.x: 7.x depends on typed-path,
# whose blanket `impl AsRef<Path<T>> for [u8]` breaks type inference of
# `.as_ref()` on byte slices elsewhere in the crate (10 errors); 8.x needs Rust
# 1.88. See docs/THIRD_PARTY_CRATE_DECISIONS.md.
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2", "bzip2"], optional = true }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"], optional = true }
# SQLite-backed formats: SqMass, OSW, OMSFile and the mzML SQLite handlers.
# `bundled` vendors SQLite so there is no system dependency, at the cost of
# compiling C - the same trade already accepted for libxml, and like libxml this
# is kept out of `default` so an ordinary build needs no C toolchain.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"], optional = true }
# zstd decoding of Bruker TDF frames (`bruker-tdf`). Pure Rust. `hash` pulls the
# pure-Rust twox-hash (xxhash64 only) so a frame's content checksum can be
# verified, as libzstd does by default under the source's opentims.
ruzstd = { version = "=0.8.1", default-features = false, features = ["std", "hash"], optional = true }
# Data parallelism. OpenMS parallelises with OpenMP - 176 pragmas, ~100 of them
# in ANALYSIS - and rayon maps onto the dominant `parallel for` shape directly.
# Default-on, because a multithreaded core is the point; disabling the feature
# gives a reproducible single-threaded build for debugging and comparison.
rayon = { version = "=1.12.0", optional = true }
# Complex FFT for MATH/STATISTICS/KernelDensityEstimation, replacing the
# evergreen FFT the C++ uses. Always used through FftPlannerScalar: its SIMD
# planner picks AVX/SSE/NEON at runtime and was measured to differ from the
# scalar path in 92-99% of output components for at most a 1.1x speedup on the
# power-of-two lengths KDE uses, so results would depend on the CPU.
rustfft = "=6.4.1"
# Crates that replace third-party C++ libraries, each chosen by measurement;
# see docs/THIRD_PARTY_CRATE_DECISIONS.md. Exact pins throughout: several newer
# releases need a Rust newer than 1.85.
# Boost.Math normal quantile via erfc_inv, for MultipleTesting's lfdr. 0.19 needs Rust 1.89.
statrs = { version = "=0.18.0", default-features = false }
# Boost.Random's mt19937_64 engine, for DecoyGenerator and UniqueIdGenerator.
rand_mt = { version = "=6.0.3", default-features = false }
# Boost.Regex semantics (lookaround, duplicate group names), used only through
# one Boost-compatible facade.
fancy-regex = { version = "=0.19.2", default-features = false, features = ["std", "unicode", "perf"] }
# HTTP for SYSTEM/NetworkGetRequest and the update check. Pure Rust, blocking,
# no async runtime. Its MSRV is exactly ours, so the pin is load-bearing.
ureq = { version = "=3.4.1", optional = true }
# Apache Arrow C++ and its Parquet reader/writer (the FORMAT Arrow/Parquet
# family). The arrow-rs sub-crates rather than the `arrow` umbrella, which would
# add arrow-arith, arrow-ord, arrow-row and arrow-string (regex) that nothing
# here calls. 60.0 needs Rust 1.88; 59.3.0 is the last release declaring 1.85.
# Codecs: every one ParquetWriteConfig names (SNAPPY, GZIP, LZ4, ZSTD) plus
# BROTLI, so files other producers wrote can be read. `zstd` builds the C zstd
# library through zstd-sys, the reason the feature stays out of `default`.
arrow-array = { version = "=59.3.0", optional = true }
arrow-schema = { version = "=59.3.0", optional = true }
arrow-buffer = { version = "=59.3.0", optional = true }
arrow-select = { version = "=59.3.0", optional = true }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap", "flate2-rust_backend", "lz4", "zstd", "brotli"], optional = true }
# BLAKE2b with an 8-byte digest for the QPX row identities (QPXIdentity), which
# the source vendors from RFC 7693. RustCrypto, pure Rust, MSRV 1.41; its
# digest/crypto-common/block-buffer/subtle dependencies are already locked
# through sha1. Enabled by `arrow`, the only feature that writes QPX.
blake2 = { version = "=0.10.6", default-features = false, optional = true }

[dev-dependencies]
# Eigen's NonLinearOptimization Levenberg-Marquardt. Measured against the Eigen
# transcription in `src/math/fitters/levenberg_marquardt.rs` and NOT adopted
# (B3-LM, decision D2's fallback; see docs/THIRD_PARTY_CRATE_DECISIONS.md), so
# the only user is the `#[ignore]`d candidate gate in
# `tests/lm_budget_differential.rs`. A dev-dependency keeps it out of the
# library's own graph while the measurement stays reproducible (lead decision of
# 2026-09-15). 0.15 needs nalgebra 0.34 and Rust 1.87. nalgebra without `std`
# keeps matrixmultiply's runtime CPU dispatch out of the graph.
levenberg-marquardt = "=0.14.0"
nalgebra = { version = "=0.33.3", default-features = false, features = ["alloc", "libm"] }

[target.'cfg(any(unix, windows))'.dependencies]
cpu-time = "=1.0.0"

# CPUID, for the startup check that this processor has the instructions an
# x86_64 build was compiled to use (src/system/cpu_features.rs). The standard
# library's `is_x86_feature_detected!` cannot answer that question: it is a
# compile-time `true` for any feature the build already enables, which is
# exactly the case the guard exists for (measured, docs/FMA_BUILD_FLAG.md).
# Reading CPUID by hand means `core::arch::__cpuid`, which is `unsafe` and this
# crate forbids; `raw-cpuid` is MIT, depends only on `core` and `bitflags`, and
# is the crate the x86 ecosystem uses for this. Not needed on any other
# architecture, so it is not in their dependency graph at all.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = { version = "=11.6.0", default-features = false }

# The console mode the source's `InitConsole` sets when libOpenMS is loaded
# (Colorizer.cpp): on Windows, ENABLE_VIRTUAL_TERMINAL_PROCESSING on standard
# output and on standard error, so that the log streams' ANSI colours render on
# a console, and the console test behind the source's `Colorizer::isTTY`.
# GetConsoleMode and SetConsoleMode are FFI, which is `unsafe` and this crate
# forbids; `winapi-util` (Unlicense OR MIT, the crate termcolor, walkdir and
# same-file use) wraps exactly those two calls. Not in any other platform's
# dependency graph (docs/THIRD_PARTY_CRATE_DECISIONS.md).
[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

# Line tables keep panics and backtraces addressable while cutting the full
# DWARF that made target/ reach 27 GB across 225 test binaries. Test semantics
# (opt-level, overflow and debug assertions) are unchanged. Stable since 1.71.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
