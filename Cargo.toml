[package]
name = "openms"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust port of the OpenMS scientific core"
license-file = "LICENSES.md"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["mzml", "idxml", "rna-json", "paramxml"]
mzml = ["dep:quick-xml", "dep:base64", "dep:flate2"]
idxml = ["dep:quick-xml"]
rna-json = ["dep:serde_json"]
paramxml = ["dep:quick-xml"]

[dependencies]
libm = "=0.2.16"
quick-xml = { version = "=0.39.4", optional = true }
base64 = { version = "=0.22.1", optional = true }
flate2 = { version = "=1.1.9", optional = true }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
